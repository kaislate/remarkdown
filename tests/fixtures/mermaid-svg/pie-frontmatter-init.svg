<svg id="rmd-mermaid-2x" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 572.9130859375 450" style="max-width: 572.913px; min-width: 430px;" role="graphics-document document" aria-roledescription="pie"><style>#rmd-mermaid-2x{font-family:Charter,Georgia,serif;font-size:16px;fill:#000000;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#rmd-mermaid-2x .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#rmd-mermaid-2x .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#rmd-mermaid-2x .error-icon{fill:#552222;}#rmd-mermaid-2x .error-text{fill:#552222;stroke:#552222;}#rmd-mermaid-2x .edge-thickness-normal{stroke-width:1px;}#rmd-mermaid-2x .edge-thickness-thick{stroke-width:3.5px;}#rmd-mermaid-2x .edge-pattern-solid{stroke-dasharray:0;}#rmd-mermaid-2x .edge-thickness-invisible{stroke-width:0;fill:none;}#rmd-mermaid-2x .edge-pattern-dashed{stroke-dasharray:3;}#rmd-mermaid-2x .edge-pattern-dotted{stroke-dasharray:2;}#rmd-mermaid-2x .marker{fill:#000000;stroke:#000000;}#rmd-mermaid-2x .marker.cross{stroke:#000000;}#rmd-mermaid-2x svg{font-family:Charter,Georgia,serif;font-size:16px;}#rmd-mermaid-2x p{margin:0;}#rmd-mermaid-2x .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#rmd-mermaid-2x .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#rmd-mermaid-2x .pieTitleText{text-anchor:middle;font-size:25px;fill:black;font-family:Charter,Georgia,serif;}#rmd-mermaid-2x .slice{font-family:Charter,Georgia,serif;fill:#000000;font-size:17px;}#rmd-mermaid-2x .legend text{fill:black;font-family:Charter,Georgia,serif;font-size:17px;}#rmd-mermaid-2x .node .neo-node{stroke:#13540c;}#rmd-mermaid-2x [data-look="neo"].node rect,#rmd-mermaid-2x [data-look="neo"].cluster rect,#rmd-mermaid-2x [data-look="neo"].node polygon{stroke:url(#rmd-mermaid-2x-gradient);filt