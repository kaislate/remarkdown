name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # Kept out of the expression below, whose parser would read the
      # closing braces of this JSON as its own end.
      NO_UPDATER_ARTIFACTS: '--config {"bundle":{"createUpdaterArtifacts":false}}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis,msi
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: ubuntu-22.04
            args: --bundles appimage,rpm
    steps:
      # First, so a missing secret fails in seconds instead of after a full
      # build: without the key the updater artifacts cannot be signed.
      # Pre-releases (a tag with a `-`, like v0.9.0-beta) build no updater
      # artifacts, so they need no key.
      - name: Check the signing secret
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is empty. Add it under Settings > Secrets and variables > Actions (see RELEASING.md)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: remarkdown v__VERSION__
          releaseBody: See the assets below to download remarkdown.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Installed copies never update to a pre-release, so it ships
          # unsigned, with no updater artifacts and no latest.json.
          uploadUpdaterJson: ${{ !contains(github.ref_name, '-') }}
          updaterJsonPreferNsis: true
          # MSI only accepts numeric prerelease versions, so a tag like
          # v0.9.0-beta builds the NSIS installer alone (see RELEASING.md).
          args: >-
            ${{ (runner.os == 'Windows' && contains(github.ref_name, '-')) && '--bundles nsis' || matrix.args }}
            ${{ contains(github.ref_name, '-') && env.NO_UPDATER_ARTIFACTS || '' }}
