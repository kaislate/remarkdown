name: Release

on:
  push:
    tags: ['v*']
  # A pre-release has no tag of its own to push: the rpm refuses a `-` in a
  # version, so a pre-release is a plain version (0.9.0) built from here
  # with this box ticked. See RELEASING.md.
  workflow_dispatch:
    inputs:
      prerelease:
        description: Pre-release (unsigned, no updater files)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
      # Kept out of the expression below, whose parser would read the
      # closing braces of this JSON as its own end.
      NO_UPDATER_ARTIFACTS: '--config {"bundle":{"createUpdaterArtifacts":false}}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis,msi
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: ubuntu-22.04
            args: --bundles appimage,rpm
    steps:
      # First, so a missing secret fails in seconds instead of after a full
      # build: without the key the updater artifacts cannot be signed.
      # Pre-releases build no updater artifacts, so they need no key.
      - name: Check the signing secret
        if: env.PRERELEASE != 'true'
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is empty. Add it under Settings > Secrets and variables > Actions (see RELEASING.md)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: remarkdown v__VERSION__
          releaseBody: See the assets below to download remarkdown.
          releaseDraft: true
          prerelease: ${{ env.PRERELEASE == 'true' }}
          # Installed copies never update to a pre-release, so it ships
          # unsigned, with no updater artifacts and no latest.json.
          uploadUpdaterJson: ${{ env.PRERELEASE != 'true' }}
          updaterJsonPreferNsis: true
          args: >-
            ${{ matrix.args }}
            ${{ env.PRERELEASE == 'true' && env.NO_UPDATER_ARTIFACTS || '' }}
