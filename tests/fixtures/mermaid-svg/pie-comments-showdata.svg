aid-3x .node .neo-node{stroke:#ccc;}#rmd-mermaid-3x [data-look="neo"].node rect,#rmd-mermaid-3x [data-look="neo"].cluster rect,#rmd-mermaid-3x [data-look="neo"].node polygon{stroke:url(#rmd-mermaid-3x-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#rmd-mermaid-3x [data-look="neo"].node path{stroke:url(#rmd-mermaid-3x-gradient);stroke-width:1px;}#rmd-mermaid-3x [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#rmd-mermaid-3x [data-look="neo"].node .neo-line path{stroke:#ccc;filter:none;}#rmd-mermaid-3x [data-look="neo"].node circle{stroke:url(#rmd-mermaid-3x-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#rmd-mermaid-3x [data-look="neo"].node circle .state-start{fill:#000000;}#rmd-mermaid-3x [data-look="neo"].icon-shape .icon{fill:url(#rmd-mermaid-3x-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#rmd-mermaid-3x [data-look="neo"].icon-shape .icon-neo path{stroke:url(#rmd-mermaid-3x-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#rmd-mermaid-3x :root{--mermaid-font-family:Charter,Georgia,serif;}</style><g></g><g transform="translate(225,225)"><circle cx="0" cy="0" r="186" class="pieOuterCircle"></circle><path d="M0,-185A185,185,0,0,1,104.954,152.347L0,0Z" fill="#0b0000" class="pieCircle"></path><path d="M104.954,152.347A185,185,0,0,1,-159.729,93.336L0,0Z" fill="#4d1037" class="pieCircle"></path><path d="M-159.729,93.336A185,185,0,0,1,-138.511,-122.636L0,0Z" fill="#3f5258" class="pieCircle"></path><path d="M-138.511,-122.636A185,185,0,0,1,0,-185L0,0Z" fill="#4f2f1b" class="pieCircle"></path><text transform="translate(132.48616395513613,-41.218671260155745)" class="slice" style="text-anchor: middle;">40%</text><text transform="translate(-30.193111159659793,135.42502921727734)" class="slice" style="text-anchor: middle;">26%</text><text transform="translate(-138.08520627580882,-13.56607193580093)" class="slice" style="text-anchor: middle;">20%</text><text transform=