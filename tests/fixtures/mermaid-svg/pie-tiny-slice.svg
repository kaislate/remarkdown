<svg id="rmd-mermaid-7x" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 566.33740234375 450" style="max-width: 566.337px; min-width: 425px;" role="graphics-document document" aria-roledescription="pie"><style>#rmd-mermaid-7x{font-family:Charter,Georgia,serif;font-size:16px;fill:#ccc;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#rmd-mermaid-7x .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#rmd-mermaid-7x .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#rmd-mermaid-7x .error-icon{fill:#a44141;}#rmd-mermaid-7x .error-text{fill:#ddd;stroke:#ddd;}#rmd-mermaid-7x .edge-thickness-normal{stroke-width:1px;}#rmd-mermaid-7x .edge-thickness-thick{stroke-width:3.5px;}#rmd-mermaid-7x .edge-pattern-solid{stroke-dasharray:0;}#rmd-mermaid-7x .edge-thickness-invisible{stroke-width:0;fill:none;}#rmd-mermaid-7x .edge-pattern-dashed{stroke-dasharray:3;}#rmd-mermaid-7x .edge-pattern-dotted{stroke-dasharray:2;}#rmd-mermaid-7x .marker{fill:lightgrey;stroke:lightgrey;}#rmd-mermaid-7x .marker.cross{stroke:lightgrey;}#rmd-mermaid-7x svg{font-family:Charter,Georgia,serif;font-size:16px;}#rmd-mermaid-7x p{margin:0;}#rmd-mermaid-7x .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#rmd-mermaid-7x .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#rmd-mermaid-7x .pieTitleText{text-anchor:middle;font-size:25px;fill:lightgrey;font-family:Charter,Georgia,serif;}#rmd-mermaid-7x .slice{font-family:Charter,Georgia,serif;fill:#ccc;font-size:17px;}#rmd-mermaid-7x .legend text{fill:lightgrey;font-family:Charter,Georgia,serif;font-size:17px;}#rmd-mermaid-7x .node .neo-node{stroke:#ccc;}#rmd-mermaid-7x [data-look="neo"].node rect,#rmd-mermaid-7x [data-look="neo"].cluster rect,#rmd-mermaid-7x [data-look="neo"].node polygon{stroke:url(#rmd-mermaid-7x-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#rmd-mermaid-7x [data-look="neo"].node path{stroke:url(#rmd-mermaid-7x-gradient);stroke-width:1px;}#rmd-mermaid-7x [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#rmd-mermaid-7x [data-look="neo"].node .neo-line path{stroke:#ccc;filter:none;}#rmd-mermaid-7x [data-look="neo"].node circle{stroke:url(#rmd-mermaid-7x-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#rmd-mermaid-7x [data-look="neo"].node circle .state-start{fill:#000000;}#rmd-mermaid-7x [data-look="neo"].icon-shape .icon{fill:url(#rmd-mermaid-7x-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#rmd-mermaid-7x [data-look="neo"].icon-shape .icon-neo path{stroke:url(#rmd-mermaid-7x-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#rmd-mermaid-7x :root{--mermaid-font-family:Charter,Georgia,serif;}</style><g></g><g transform="translate(225,225)"><circle cx="0" cy="0" r="186" class="pieOuterCircle"></circle><path d="M0,-185A185,185,0,0,1,104.906,152.38L0,0Z" fill="#0b0000" class="pieCircle"></path><path d="M104.906,152.38A185,185,0,0,1,-178.311,49.298L0,0Z" fill="#4d1037" class="pieCircle"></path><path d="M-178.311,49.298A185,185,0,0,1,0,-185L0,0Z" fill="#4f2f1b" class="pieCircle"></path><text transform="translate(132.49268600036524,-41.19770207679814)" class="slice" style="text-anchor: middle;">40%</text><text transform="translate(-47.45529488643647,130.3823511340448)" class="slice" style="text-anchor: middle;">30%</text><text transform="translate(-110.41195537365299,-84.02834409035121)" class="slice" style="text-anchor: middle;">29%</text><text x="0" y="-200" class="pieTitleText">Disk usage</text><g class="legend" transform="translate(216,-44)"><rect width="18" height="18" style="fill: rgb(11, 0, 0); stroke: rgb(11, 0, 0);"></rect><text x="22" y="14">System</text></g><g class="legend" transform="translate(216,-22)"><rect width="18" height="18" style="fill: rgb(77, 16, 55); s